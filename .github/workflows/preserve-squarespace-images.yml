name: Preserve Squarespace images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preserve-squarespace-images.yml'

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download recoverable Squarespace images
        run: node astro-rebuild/scripts/preserve-squarespace-images.mjs
      - name: Commit preserved assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astro-rebuild/public/images/recovered astro-rebuild/src/data/recovered-images.json astro-rebuild/migration/2026-09-25/squarespace-image-preservation.json
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Preserve Squarespace image assets"
            git push
          fi
