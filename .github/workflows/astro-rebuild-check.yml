name: Astro portfolio check

on:
  push:
    branches: [main]
    paths:
      - 'astro-rebuild/**'
      - '.github/workflows/astro-rebuild-check.yml'
  pull_request:
    paths:
      - 'astro-rebuild/**'
      - '.github/workflows/astro-rebuild-check.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-rebuild
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
