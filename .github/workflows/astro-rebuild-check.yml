name: Astro rebuild check

on:
  push:
    branches: [astro-rebuild]
    paths:
      - 'astro-rebuild/**'
  pull_request:
    paths:
      - 'astro-rebuild/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
